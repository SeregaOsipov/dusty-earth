[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dusty-earth"
version = "0.1.0"
description = "High-performance GPU-accelerated meteorological & dust forecast visualization platform"
readme = "README.md"
authors = [
    { name = "Sergey Osipov", email = "sosipov@hbku.edu.qa" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "xarray>=2022.03.0",
    "netCDF4>=1.5.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dusty-export = "dusty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
